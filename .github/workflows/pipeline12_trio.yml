name: AI Conduit Trio Pipeline

on:
  schedule:
    - cron: '0 12 * * *'  # 毎日21:00 JST (UTC 12:00)
  workflow_dispatch:
    inputs:
      style:
        description: 'スタイル選択 (fireship/bytebyteGo/oni/random)'
        required: false
        default: 'random'

jobs:
  generate_trio_video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install requests edge-tts pillow numpy moviepy pygments pydub playwright
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium

      - name: Step 1 - 動画生成
        run: |
          STYLE="${{ github.event.inputs.style }}"
          if [ "$STYLE" = "random" ] || [ -z "$STYLE" ]; then
            STYLE=""
          fi
          export TRIO_STYLE="$STYLE"
          python3 scripts/main_pipeline.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Step 2 - 動画確認
        run: |
          ls -lh output/*.mp4 2>/dev/null || echo "動画なし"
          cat output/trio_plan.json 2>/dev/null | python3 -c "
          import json,sys
          p=json.load(sys.stdin)
          print('スタイル:', p.get('style','?'))
          print('タイトル:', p.get('title','?'))
          print('シーン数:', len(p.get('scenes',[])))
          " || true

      - name: Step 3 - Artifact保存
        uses: actions/upload-artifact@v4
        with:
          name: trio-video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 3
